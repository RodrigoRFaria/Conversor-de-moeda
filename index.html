<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montenegrin+Gothic+One&family=Oswald:wght@200..700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./style.css">

    <title>DevClub - Convert Money</title>
</head>

<body>
    <img class="logo" src="./assets/logo.jpg" alt="Logo-DevClub-convert-Money">

    <main>
        <label>
            Converter <b>de</b>
            <select>
                <option>R$ Real Brasileiro</option>
            </select>
        </label>
        <label>
            Converter <b>para</b>
            <select class="currency-select">
                <option value="USD">US$ Dólar Americano</option>
                <option value="EUR">€ Euro</option>
                <option value="GBP">£ Libra Esterlina</option>
                <option value="JPY">¥ Iene Japonês</option>
            </select>
        </label>
        <label>
            Valor a ser <b>convertido</b>
            <input class="currency-input" placeholder="Digite o valor">
        </label>

        <button class="convert-button">Converter</button>

        <section>
            <div class="currency-box">
                <img class="flag" src="./assets/real.png" alt="logo-moeda-a-ser-convertida">
                <p class="currency-name">Real Brasileiro</p>
                <p class="currency-value Real">R$ 0,00</p>
            </div>

            <img class="arrow" src="./assets/seta.png" alt="seta-conversao">

            <div class="currency-box">
                <img class="currency-img" src="./assets/dolar.png" alt="logo-moeda-convertida">
                <p class="currency-name" id="currency-name">Dólar Americano</p>
                <p class="currency-value, Converted">US$ 0,00</p>
            </div>
        </section>
    </main>


</body>
<script src="./scripts.js"></script>

</html>
